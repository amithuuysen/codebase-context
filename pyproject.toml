[project]
name = "codecontext"
version = "0.4.0"
description = "Semantic code search MCP server — Tree-sitter + LlamaIndex + FAISS"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "faiss-cpu>=1.7.0",
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-faiss>=0.2.0",
    "llama-index-embeddings-openai>=0.2.0",
    "llama-index-embeddings-ollama>=0.3.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "sentence-transformers>=2.2.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "httpx>=0.24.0",
    "starlette>=0.27.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
codecontext = "codecontext.mcp.server:main"
codecontext-server = "codecontext.server.index_server:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
